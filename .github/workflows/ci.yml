name: Chaos-Harness CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run offline tests and local HTTP integration checks
        env:
          GEMMA_MODEL: "gemma-4-26b-a4b-it"
          GEMINI_API_KEY: ""
          OPTIONAL_CLOUD_ENDPOINT: ""
          OPTIONAL_CLOUD_KEY: ""
        run: |
          python -m pytest -q

      - name: Verify the mock CLI and demo on this platform
        run: |
          python -m harness.cli --mock --heal --categories role-reversal --json
          python deploy_and_benchmarks/run_demo.py --mock --fast --json
