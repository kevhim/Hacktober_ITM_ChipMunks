[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-harness"
version = "0.2.0"
description = "Observed adversarial prompt evaluation and candidate hardening"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "google-genai>=1.0.0", "pydantic>=2.0.0", "rich>=13.7.0",
  "python-dotenv>=1.0.0", "requests>=2.31.0", "chardet>=3.0.2,<6.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
chaos-harness = "harness.cli:main"
chaos-demo = "deploy_and_benchmarks.run_demo:main"
chaos-dashboard = "deploy_and_benchmarks.dashboard:main"

[tool.setuptools.packages.find]
include = ["harness*", "deploy_and_benchmarks*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
deploy_and_benchmarks = ["sample_targets.json"]
